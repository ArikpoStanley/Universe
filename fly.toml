app = "universe-web"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_PORTAL_URL = "https://portal-universe.fly.dev"
    NEXT_PUBLIC_API_URL = "https://universe-backend.fly.dev"
    API_ORIGIN = "https://universe-backend.fly.dev"
    API_INTERNAL_URL = "https://universe-backend.fly.dev"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  NEXT_PUBLIC_PORTAL_URL = "https://portal-universe.fly.dev"
  NEXT_PUBLIC_API_URL = "https://universe-backend.fly.dev"
  API_ORIGIN = "https://universe-backend.fly.dev"
  API_INTERNAL_URL = "https://universe-backend.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
